<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RörelseLabbet • Studieapp</title><style>
:root{--bg:#f5f7f5;--ink:#18362e;--muted:#6b7c75;--accent:#2e8064;--soft:#e8f3ed;--line:#dce6df;--white:#fff;--warm:#fff6e9;--bad:#b54d42}*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:#26795d}aside{position:fixed;inset:0 auto 0 0;width:246px;background:#153c32;color:#e5f6eb;padding:25px 16px;display:flex;flex-direction:column;gap:7px;overflow:auto}aside h1{font-size:22px;margin:8px 12px 0;letter-spacing:-.8px}aside .sub{color:#a4cabb;font-size:12px;margin:0 12px 26px}aside button{background:none;border:0;color:#d6ece2;text-align:left;padding:12px 15px;border-radius:12px;font-weight:600}aside button.active,aside button:hover{background:#2d6653;color:#fff}aside .foot{margin-top:auto;font-size:12px;color:#b7d0c5;padding:15px}main{margin-left:246px;max-width:1350px;padding:36px 44px 90px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px}h2{font-size:clamp(27px,3vw,38px);letter-spacing:-1.2px;margin:4px 0 8px;line-height:1.15}h3{font-size:19px;margin:0 0 12px}p{margin:7px 0 14px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:23px;box-shadow:0 7px 25px #173e3008}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stat strong{font-size:30px;display:block;line-height:1.3}.stat small{color:var(--muted)}.pill{display:inline-block;background:var(--soft);color:#2b7258;border-radius:100px;padding:5px 11px;font-size:12px;font-weight:750}.btn{background:var(--accent);border:1px solid var(--accent);border-radius:11px;padding:10px 17px;color:white;font-weight:750}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;color:var(--ink);border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.small{padding:7px 11px;font-size:13px}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.gap{height:19px}.progress{height:9px;background:#e5eee7;border-radius:20px;overflow:hidden}.progress>i{height:100%;background:var(--accent);display:block;border-radius:20px}.topic{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}.topic:last-child{border:0}.question{font-size:clamp(20px,2.3vw,28px);line-height:1.35;letter-spacing:-.5px;font-weight:750;margin:18px 0 26px}.answer{background:var(--soft);padding:18px;border-radius:13px;border-left:4px solid var(--accent);white-space:pre-line}.option{display:block;text-align:left;width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:13px;margin:9px 0}.option:hover{border-color:var(--accent)}.option.selected{border-color:var(--accent);background:var(--soft)}.option.correct{border-color:#399569;background:#e5f5e9}.option.wrong{border-color:#d58177;background:#fff0ec}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.filters button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:30px}.filters button.active{background:#d5eddf;border-color:#80bea1}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.book-row{padding:16px 0;border-bottom:1px solid var(--line)}.book-row:last-child{border:0}.book-row summary{cursor:pointer;font-weight:700}.book-row details{margin:9px 0}.book-row details p{font-size:13px;line-height:1.7;padding:12px;background:#f5f8f6;white-space:pre-wrap;border-radius:8px;max-height:350px;overflow:auto}.source{font-size:12px;color:var(--muted);margin:15px 0}.source a{font-weight:700}.hero{background:linear-gradient(110deg,#194d3c,#34886b);border-radius:21px;padding:29px;color:#fff;display:flex;justify-content:space-between;gap:25px;align-items:center}.hero p{color:#d3e9dc;max-width:600px}.hero h2{font-size:31px}.hero .btn{background:white;color:#20563f;border:0}.empty{padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;bottom:22px;right:22px;background:#173d30;color:white;padding:12px 18px;border-radius:11px;box-shadow:0 10px 30px #0002;z-index:10}.notice{background:#fff9ed;border:1px solid #ecd7a8;padding:13px 17px;border-radius:12px;font-size:13px}.hidden{display:none!important}textarea{width:100%;min-height:115px;border:1px solid var(--line);padding:13px;border-radius:11px;resize:vertical}select{border:1px solid var(--line);background:white;border-radius:10px;padding:10px;max-width:100%}.tiny{font-size:12px}.kicker{color:#95d8b4;text-transform:uppercase;font-size:11px;font-weight:800;letter-spacing:2px}.mobilehead{display:none}.qcounter{font-size:12px;font-weight:700;color:var(--muted)}.readtext{white-space:pre-wrap;line-height:1.9;font-size:15px}.review{border-left:4px solid #d0a45d}.links{display:flex;gap:10px;flex-wrap:wrap}.links a{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:white;font-size:13px}@media(max-width:850px){aside{position:sticky;top:0;width:100%;height:auto;flex-direction:row;padding:9px;gap:4px;overflow:auto;z-index:5}aside h1,aside .sub,aside .foot{display:none}aside button{white-space:nowrap;padding:9px;font-size:12px}main{margin:0;padding:23px 15px 65px}.grid,.grid.two{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:12px}}
</style></head><body><aside id="nav"><h1>◉ RörelseLabbet</h1><div class="sub">Din personliga tentaplugg-app</div><button data-page="home" class="active">⌂ &nbsp; Översikt</button><button data-page="learn">▤ &nbsp; Läs & lär</button><button data-page="flash">▣ &nbsp; Flashcards</button><button data-page="quiz">✓ &nbsp; Quiz</button><button data-page="exam">✎ &nbsp; Övningstenta</button><button data-page="review">↻ &nbsp; Repetera</button><button data-page="library">▥ &nbsp; Kursbibliotek</button><button data-page="stats">▥ &nbsp; Framsteg</button><div class="foot">Offlinevänlig • Dina framsteg sparas lokalt i webbläsaren.<br><br>Materialbaserad övning – kontrollera alltid med lärarens anvisningar.</div></aside><main id="app"></main><script src="data.js"></script><script>
const D=STUDY_DATA,TOPICS=['Terminologi','Vävnader','Skelett','Leder','Muskler','Patologi'],ICON={Terminologi:'◈',Vävnader:'◉',Skelett:'♧',Leder:'◎',Muskler:'⌁',Patologi:'✚'};let S;try{S=JSON.parse(localStorage.getItem('rorelselab_v1'))||{}}catch(e){S={}}S.seen??={};S.stars??={};S.wrong??={};S.history??=[];S.daily??={};let page='home',topic='Alla',qtype='all',queue=[],idx=0,shown=false,selected=null,mode='flash',examStart=0,examResults=[],readSource=null,search='';const app=document.getElementById('app');function save(){localStorage.setItem('rorelselab_v1',JSON.stringify(S))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function go(p){if(['flash','quiz','exam'].includes(p)){queue=[];idx=0;shown=false;selected=null}page=p;document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render();scrollTo(0,0)}document.querySelectorAll('aside button').forEach(b=>b.onclick=()=>go(b.dataset.page));function count(t){return D.questions.filter(q=>q.topic===t).length}function sourceLink(q){let [s,n]=q.src.split(':');if(s==='Kursbok')return `<a target="_blank" href="material/kursbok_digital.html">Kursbok, s. ${esc(n)} ↗</a>`;let m=D.sources.find(x=>x.id===s);return m?`<a target="_blank" href="${encodeURI(m.file)}#page=${parseInt(n)||1}">${esc(s)}, PDF-sida ${esc(n)} ↗</a>`:esc(q.src)}function title(k,h,sub=''){return `<div class="top"><div><div class="eyebrow">${k}</div><h2>${h}</h2>${sub?`<p class="muted">${sub}</p>`:''}</div><span class="pill">${D.questions.length} övningsfrågor</span></div>`}function topicFilters(action){return `<div class="filters">${['Alla',...TOPICS].map(t=>`<button class="${topic===t?'active':''}" onclick="topic='${t}';${action}">${t} ${t!=='Alla'?'('+count(t)+')':''}</button>`).join('')}</div>`}function filtered(){return D.questions.filter(q=>topic==='Alla'||q.topic===topic)}function stat(){return Object.keys(S.seen).length}function daily(){return S.daily[new Date().toLocaleDateString('sv-SE')]||0}function home(){let reviewed=Object.keys(S.seen).length;app.innerHTML=`<div class="hero"><div><div class="kicker">DIN STUDIEAPP INFÖR MÅNDAG</div><h2>Rörelseapparaten, från teori till tenta.</h2><p>Plugga anatomi och fysiologi med kursanknutna frågor, lärarens instuderingsfrågor och hela det uppladdade materialet.</p><button class="btn" onclick="start('flash')">Börja plugga →</button></div><div style="font-size:75px;opacity:.5">◉</div></div><div class="gap"></div><div class="grid"><div class="card stat"><small>Övningsfrågor</small><strong>${D.questions.length}</strong><span class="pill">6 studieområden</span></div><div class="card stat"><small>Frågor du övat på</small><strong>${reviewed}</strong><div class="progress"><i style="width:${100*reviewed/D.questions.length}%"></i></div></div><div class="card stat"><small>Frågor besvarade i dag</small><strong>${daily()}</strong><span class="muted tiny">Upprepad övning räknas också</span></div></div><div class="gap"></div><div class="grid two"><div class="card"><h3>Välj studieområde</h3>${TOPICS.map(t=>`<div class="topic"><div><b>${ICON[t]} &nbsp;${t}</b><div class="muted tiny">${count(t)} frågor</div></div><button class="btn secondary small" onclick="topic='${t}';start('flash')">Öva →</button></div>`).join('')}</div><div><div class="card"><h3>Din plan fram till måndag</h3><p class="muted">Ett förslag – anpassa efter vad som känns svårt.</p>${[['Tis–ons','Terminologi, skelett & leder'],['Tors–fre','Muskelfysiologi, vävnader & patologi'],['Lördag','Anatomi: ben, leder & strukturer'],['Söndag','Blandad övningstenta & svaga områden'],['Måndag','Kort repetition']].map(x=>`<div class="topic"><b>${x[0]}</b><span class="muted tiny" style="text-align:right">${x[1]}</span></div>`).join('')}</div><div class="gap"></div><div class="card"><h3>Digital kursbok</h3><p class="muted">Alla 43 fotograferade sidor finns i din digitala läsversion. Föreläsnings-PDF:erna finns också i biblioteket.</p><div class="links"><a href="material/kursbok_digital.html" target="_blank">Öppna kursboken ↗</a><a href="#" onclick="go('library');return false">Hela biblioteket →</a></div></div></div></div>`}
function learn(){app.innerHTML=title('TEORI & BEGREPP','Läs & lär','Sök i våra kursbaserade förklaringar och använd källhänvisningen för att läsa mer.')+`<input class="search" placeholder="Sök bland frågor, svar och begrepp…" value="${esc(search)}" oninput="search=this.value;renderLearn()">`+topicFilters('renderLearn()')+`<div id="learnList"></div>`;renderLearn()}function renderLearn(){let el=document.getElementById('learnList');if(!el)return;let rows=filtered().filter(q=>(q.q+' '+q.a).toLowerCase().includes(search.toLowerCase()));el.innerHTML=`<div class="muted tiny" style="margin-bottom:10px">${rows.length} träffar</div><div class="grid two">${rows.map(q=>`<div class="card"><span class="pill">${q.topic}</span><h3 style="margin-top:12px">${esc(q.q)}</h3><p>${esc(q.a)}</p><div class="source">Källa: ${sourceLink(q)}</div><button class="btn secondary small" onclick="star(${q.id})">${S.stars[q.id]?'★ Sparad':'☆ Spara till repetition'}</button></div>`).join('')}</div>`}
function start(m,arr){mode=m;queue=(arr||filtered()).slice().sort(()=>Math.random()-.5);if(m==='quiz')queue=queue.filter(q=>q.opts.length===4);if(m==='exam'){queue=D.questions.filter(q=>q.opts.length===4).sort(()=>Math.random()-.5).slice(0,25);examStart=Date.now();examResults=[]}idx=0;shown=false;selected=null;page=m==='exam'?'exam':m;document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();scrollTo(0,0)}function source(q){return `<div class="source">Källa: ${sourceLink(q)} <span class="muted">• Kursbaserad sammanfattning</span></div>`}function mark(q,correct){S.seen[q.id]=(S.seen[q.id]||0)+1;if(!correct)S.wrong[q.id]=(S.wrong[q.id]||0)+1;else if(S.wrong[q.id])S.wrong[q.id]=Math.max(0,S.wrong[q.id]-1);let k=new Date().toLocaleDateString('sv-SE');S.daily[k]=(S.daily[k]||0)+1;save()}function star(id){S.stars[id]=!S.stars[id];save();toast(S.stars[id]?'Sparad för repetition':'Borttagen från repetition');if(page==='learn')renderLearn();else render()}function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),2300)}function next(){idx++;shown=false;selected=null;render();scrollTo(0,0)}function exercise(){if(!queue.length){app.innerHTML=title('ÖVNING','Inga frågor','Välj ett annat område eller övningsläge.')+`<button class="btn" onclick="go('home')">Till översikten</button>`;return}if(idx>=queue.length){finish();return}let q=queue[idx],isFlash=mode==='flash'||mode==='review',isExam=mode==='exam';app.innerHTML=title(isExam?'TENTASIMULERING':isFlash?'AKTIV ÅTERKALLNING':'FLERVALSQUIZ',isExam?'Övningstenta':isFlash?'Flashcards':'Quiz',isExam?'25 blandade frågor. Resultatet visas efter sista frågan.':'Försök svara innan du visar facit.')+`<div class="card" style="max-width:850px"><div class="flex between"><span class="pill">${q.topic}</span><span class="qcounter">Fråga ${idx+1} av ${queue.length}</span></div><div class="progress" style="margin-top:17px"><i style="width:${100*idx/queue.length}%"></i></div><div class="question">${esc(q.q)}</div>${isFlash?`<div id="answerArea">${shown?`<div class="answer"><b>Facit</b><p>${esc(q.a)}</p></div>${source(q)}<div class="flex"><button class="btn secondary" onclick="mark(queue[idx],false);next()">Behöver repetera</button><button class="btn" onclick="mark(queue[idx],true);next()">Kunde svaret ✓</button></div>`:`<button class="btn" onclick="shown=true;render()">Visa svar</button>`}</div>`:`<div>${q.opts.map((o,i)=>`<button class="option ${selected===i?'selected':''} ${shown&&o===q.a?'correct':''} ${shown&&selected===i&&o!==q.a?'wrong':''}" onclick="choose(${i})" ${shown?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}${shown?`<div class="answer"><b>${q.opts[selected]===q.a?'Rätt!':'Rätt svar:'}</b><p>${esc(q.a)}</p></div>${source(q)}<button class="btn" onclick="next()">${idx===queue.length-1?'Visa resultat':'Nästa fråga →'}</button>`:`<button class="btn" onclick="check()" ${selected===null?'disabled':''}>Kontrollera svar</button>`}</div>`}<div class="flex between" style="margin-top:20px"><button class="btn secondary small" onclick="star(${q.id})">${S.stars[q.id]?'★ Sparad':'☆ Spara'}</button><button class="btn secondary small" onclick="if(confirm('Avsluta övningen?'))go('home')">Avsluta</button></div></div>`}function choose(i){if(!shown){selected=i;render()}}function check(){if(selected===null)return;let q=queue[idx];shown=true;let ok=q.opts[selected]===q.a;mark(q,ok);if(mode==='exam')examResults.push({id:q.id,correct:ok});render()}function finish(){if(mode==='exam'){let correct=examResults.filter(x=>x.correct).length;S.history.unshift({date:new Date().toLocaleString('sv-SE'),correct,total:queue.length});S.history=S.history.slice(0,50);save();app.innerHTML=title('RESULTAT','Övningstentan klar')+`<div class="card" style="max-width:740px;text-align:center"><div class="eyebrow">Ditt resultat</div><div style="font-size:68px;font-weight:850">${correct}/${queue.length}</div><p class="muted">${Math.round(correct/queue.length*100)} % rätt • ${Math.ceil((Date.now()-examStart)/60000)} min</p><div class="progress"><i style="width:${correct/queue.length*100}%"></i></div><div class="gap"></div><button class="btn" onclick="start('exam')">Gör ny tenta</button> <button class="btn secondary" onclick="go('review')">Repetera svaga områden</button></div><div class="gap"></div><div class="card"><h3>Genomgång</h3>${examResults.map(r=>{let q=D.questions.find(x=>x.id===r.id);return `<div class="topic"><span>${r.correct?'✓':'↻'} ${esc(q.q)}</span><button class="btn secondary small" onclick="toast('${r.correct?'Rätt':'Repetera i frågebanken'}')">${r.correct?'Rätt':'Repetera'}</button></div>`}).join('')}</div>`}else{app.innerHTML=title('KLART','Bra jobbat!')+`<div class="card" style="max-width:750px"><h3>Du har gått igenom ${queue.length} frågor.</h3><p class="muted">Återkom till svåra frågor och prova sedan en blandad övningstenta.</p><button class="btn" onclick="start('${mode}')">Öva igen</button> <button class="btn secondary" onclick="go('review')">Repetera svåra frågor</button></div>`}}
function review(){let weak=D.questions.filter(q=>S.wrong[q.id]>0||S.stars[q.id]);app.innerHTML=title('SPACED REPETITION','Repetera det som är svårt','Här samlas frågor du markerat eller svarat fel på. Rätt svar minskar antalet felsteg.')+`<div class="card"><h3>${weak.length} frågor väntar</h3><p class="muted">Välj att öva på alla sparade och svåra frågor eller börja med ett särskilt område.</p><button class="btn" ${weak.length?'':'disabled'} onclick="start('review',D.questions.filter(q=>S.wrong[q.id]>0||S.stars[q.id]))">Starta repetition →</button></div><div class="gap"></div><div class="grid two">${weak.map(q=>`<div class="card review"><span class="pill">${q.topic}</span><h3 style="margin-top:10px">${esc(q.q)}</h3><p class="muted tiny">Felsteg: ${S.wrong[q.id]||0} ${S.stars[q.id]?' • ★ Sparad':''}</p><details><summary>Visa svar</summary><p>${esc(q.a)}</p>${source(q)}</details></div>`).join('')}</div>`}
function library(){let s=D.sources.filter(x=>x.name.toLowerCase().includes(search.toLowerCase())||x.id.toLowerCase().includes(search.toLowerCase()));app.innerHTML=title('ALLT KURSMATERIAL','Ditt kursbibliotek','11 PDF-filer med föreläsningar, instuderingsfrågor och kursplaner – samt din digitala kursbok med 43 sidor.')+`<div class="notice">Föreläsningarnas extraherade text finns nedan för sökning och läsning. Bilder, diagram och layout finns i original-PDF:erna. Kursboken är fotograferad och öppnas därför i bildbaserad läsversion.</div><div class="gap"></div><div class="card"><h3>📖 Digital kursbok • 43 sidor</h3><p class="muted">Histologi, osteologi, ledlära, muskelfysiologi, patologi och undersökningsmetodik. Samtliga fotograferade sidor ingår.</p><a class="btn" style="display:inline-block;text-decoration:none" target="_blank" href="material/kursbok_digital.html">Öppna hela kursboken ↗</a> <a class="btn secondary" style="display:inline-block;text-decoration:none" target="_blank" href="${encodeURI('material/sep. 22, Doc 1.pdf')}">Original-PDF ↗</a></div><div class="gap"></div><input class="search" placeholder="Filtrera dokument…" value="${esc(search)}" oninput="search=this.value;library()"><div class="gap"></div><div class="card">${s.map((x,i)=>`<div class="book-row"><div class="flex between"><div><span class="pill">${x.total} sidor</span><h3 style="margin-top:8px">${esc(x.name)}</h3><div class="muted tiny">${esc(x.id)}</div></div><a class="btn secondary small" target="_blank" href="${encodeURI(x.file)}">Öppna PDF ↗</a></div>${x.pages.length?`<details><summary>Visa extraherad text (${x.pages.length} textsidor)</summary>${x.pages.map(p=>`<details><summary>Sida ${p.n}</summary><p class="readtext">${esc(p.text)}</p><a target="_blank" href="${encodeURI(x.file)}#page=${p.n}">Visa originalsidan ↗</a></details>`).join('')}</details>`:''}</div>`).join('')}</div>`}
function stats(){let hist=S.history||[],seen=Object.keys(S.seen).length;app.innerHTML=title('DIN UTVECKLING','Framsteg','Dina resultat sparas på den här enheten och i just den här webbläsaren.')+`<div class="grid"><div class="card stat"><small>Unika frågor övade</small><strong>${seen}/${D.questions.length}</strong></div><div class="card stat"><small>Svåra frågor</small><strong>${Object.values(S.wrong).filter(n=>n>0).length}</strong></div><div class="card stat"><small>Genomförda tentor</small><strong>${hist.length}</strong></div></div><div class="gap"></div><div class="grid two"><div class="card"><h3>Täckning per område</h3>${TOPICS.map(t=>{let n=D.questions.filter(q=>q.topic===t&&S.seen[q.id]).length;return `<div class="topic" style="display:block"><div class="flex between"><b>${t}</b><span class="muted tiny">${n}/${count(t)}</span></div><div class="progress" style="margin-top:8px"><i style="width:${100*n/count(t)}%"></i></div></div>`}).join('')}</div><div class="card"><h3>Senaste övningstentorna</h3>${hist.length?hist.map(h=>`<div class="topic"><span>${esc(h.date)}</span><b>${h.correct}/${h.total} (${Math.round(h.correct/h.total*100)} %)</b></div>`).join(''):'<p class="muted">Ingen genomförd tenta ännu.</p>'}<div class="gap"></div><button class="btn secondary small" onclick="exportProgress()">Exportera mina framsteg</button> <button class="btn secondary small" onclick="if(confirm('Radera alla sparade framsteg?')){localStorage.removeItem('rorelselab_v1');location.reload()}">Nollställ</button></div></div>`}function exportProgress(){let b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mina-studieframsteg.json';a.click();URL.revokeObjectURL(a.href)}function render(){if(page==='home')home();else if(page==='learn')learn();else if(page==='flash'||page==='quiz')queue.length?exercise():setup();else if(page==='exam')queue.length?exercise():document.querySelector('[data-page=exam]').onclic
