<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anatomi Flashcards v3</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><aside><h1>🧠 Anatomi<br>Flashcards</h1><button data-mode="flash" class="active">🃏 Flashcards</button><button data-mode="multi">🎯 Flervalsquiz</button><button data-mode="write">⌨️ Skriv svaret</button><button data-mode="review">🔥 Repetition</button><button data-mode="stats">📊 Statistik</button><hr><button data-cat="all" class="cat active">Alla</button><button data-cat="muskel" class="cat">💪 Muskler</button><button data-cat="ben" class="cat">🦴 Skelett</button><button data-cat="landmark" class="cat">📍 Landmärken</button><small>Version 3</small></aside><main><header><select id="region"></select><b id="counter"></b></header><div id="study"><div class="grid"><section class="panel"><div id="visual"></div></section><section class="panel"><div id="front"><h2>Vilken struktur är markerad?</h2><div id="hintbox" class="box hidden"></div></div><div id="back" class="hidden"><h2 id="name"></h2><h3 id="sv"></h3><div class="box">🧠 <b>Minnestips</b><p id="mn"></p></div></div><div id="multi" class="hidden"><h2>Välj rätt namn</h2><div id="opts"></div></div><div id="write" class="hidden"><h2>Skriv namnet</h2><input id="answer"><button id="check">Rätta</button><div id="feedback"></div></div></section></div><div class="controls"><button id="flip">↻ Vänd</button><button data-score="bad" class="bad">✕ Kunde inte</button><button data-score="mid" class="mid">? Nästan</button><button data-score="good" class="good">✓ Kunde</button><button id="hint">💡 Ledtråd</button></div></div><div id="stats" class="hidden"></div><p class="note">Dedikerade anatomibilder används där de har genererats och godkänts. Övriga kort använder en neutral regional platta, tydligt markerad som sådan.</p></main></div><script src="app.js"></script></body></html>
